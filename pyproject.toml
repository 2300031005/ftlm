[project]
name = "wind-purchasing-service"
version = "0.1.0"
description = "Elexon BMRS wind generation data ingestion, analysis engine, and FastAPI service for day-ahead purchasing decisions"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
